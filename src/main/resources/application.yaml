spring:
  application:
    name: TDD-BE
  jackson:
    time-zone: Asia/Seoul
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    show-sql: true
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_APP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# access/refresh 토큰 발급용. 기본값(fallback)을 두지 않는다 - JWT_SECRET이 없으면
# 기동 자체가 실패해야 "모두가 아는 임시 시크릿"으로 운영에 배포되는 사고를 막을 수 있다.
# 로컬 개발용 임시 값은 application-local.yaml(local 프로필)에 따로 둔다.
jwt:
  secret: ${JWT_SECRET}
  access-token-validity-seconds: 1800 # 30분
  refresh-token-validity-seconds: 2592000 # 30일(1달)

client:
  allowed-origins: ${CLIENT_ALLOWED_ORIGINS}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
