spring:
  application:
    name: TDD-BE
  jackson:
    time-zone: Asia/Seoul
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    show-sql: true
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_APP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

# access/refresh 토큰 발급용. 기본값(fallback)을 두지 않는다 - JWT_SECRET이 없으면
# 기동 자체가 실패해야 "모두가 아는 임시 시크릿"으로 운영에 배포되는 사고를 막을 수 있다.
# 로컬 개발용 임시 값은 application-local.yaml(local 프로필)에 따로 둔다.
jwt:
  secret: ${JWT_SECRET}
  access-token-validity-seconds: 1800 # 30분
  refresh-token-validity-seconds: 2592000 # 30일(1달)

client:
  allowed-origins: ${CLIENT_ALLOWED_ORIGINS}

# S3 업로드/Presigned URL 발급용. credential은 코드/설정에 두지 않는다 - 운영 EC2는 인스턴스에
# 연결된 IAM 역할(tdd-ec2-s3-assets-role)을 SDK 기본 자격증명 체인이 자동으로 사용하고,
# 로컬 개발은 AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY 환경변수나 ~/.aws/credentials를 그대로 쓴다.
# 환경변수 이름은 deploy.yml이 EC2 런타임 .env에 심어주는 Repository Variables 이름과 맞춰야
# 한다(PR #71 참고). 버킷은 둘로 나뉜다 - 채팅·기숙사 인증 이미지는 비공개 버킷(presigned GET으로만
# 조회), 프로필 이미지는 공개 버킷(만료 없는 완성된 URL을 base URL + key로 조립해서 조회)이다.
aws:
  s3:
    private-bucket: ${S3_PRIVATE_BUCKET:tdd-assets-930525999361-ap-northeast-2-an}
    public-bucket: ${S3_PUBLIC_BUCKET}
    public-base-url: ${S3_PUBLIC_BASE_URL}
    region: ${AWS_REGION:ap-northeast-2}
    presigned-get-expiration-seconds: 600 # 10분 - 비공개 버킷 조회용 Presigned GET URL 만료 시간

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
