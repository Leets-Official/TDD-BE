spring:
  application:
    name: TDD-BE
  jackson:
    time-zone: Asia/Seoul
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    show-sql: true
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_APP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# access/refresh 토큰 발급용. 기본값(fallback)을 두지 않는다 - JWT_SECRET이 없으면
# 기동 자체가 실패해야 "모두가 아는 임시 시크릿"으로 운영에 배포되는 사고를 막을 수 있다.
# 로컬 개발용 임시 값은 application-local.yaml(local 프로필)에 따로 둔다.
jwt:
  secret: ${JWT_SECRET}
  access-token-validity-seconds: 1800 # 30분
  refresh-token-validity-seconds: 2592000 # 30일(1달)

client:
  allowed-origins: ${CLIENT_ALLOWED_ORIGINS}

# 이미지 스토리지. 버킷 이름·리전·공개 URL은 비밀값이 아니므로 GitHub Repository Variables로
# 관리하며 배포 시 .env로 전달된다. jwt.secret과 같은 이유로 기본값(fallback)을 두지 않는다 -
# 값이 없으면 기동 자체가 실패해야 잘못된 버킷에 업로드되는 사고를 막을 수 있다.
# 로컬/테스트용 임시 값은 application-local.yaml, src/test/resources/application.yaml에 둔다.
s3:
  private-bucket: ${S3_PRIVATE_BUCKET}
  public-bucket: ${S3_PUBLIC_BUCKET}
  public-base-url: ${S3_PUBLIC_BASE_URL}
  region: ${AWS_REGION}
  presigned-url-validity-seconds: 300 # 5분
  max-file-size-bytes: 10485760 # 10MB

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
