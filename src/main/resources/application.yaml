spring:
  application:
    name: TDD-BE
  jackson:
    time-zone: Asia/Seoul
  jpa:
    # ddl-auto는 여기 두지 않는다. 스키마는 Flyway 마이그레이션(src/main/resources/db/migration)이
    # 전담하고, Hibernate는 스키마를 만들거나 바꾸지 않는다(공유 DB에서 기동 시 스키마가
    # 의도치 않게 바뀌는 걸 막기 위함). 스키마를 바꿀 땐 새 V{n}__설명.sql 파일을 추가할 것.
    show-sql: true
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_APP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# access/refresh 토큰 발급용. 기본값(fallback)을 두지 않는다 - JWT_SECRET이 없으면
# 기동 자체가 실패해야 "모두가 아는 임시 시크릿"으로 운영에 배포되는 사고를 막을 수 있다.
# 로컬 개발용 임시 값은 application-local.yaml(local 프로필)에 따로 둔다.
jwt:
  secret: ${JWT_SECRET}
  access-token-validity-seconds: 1800 # 30분
  refresh-token-validity-seconds: 2592000 # 30일(1달)
