spring:
  application:
    name: TDD-BE
  jackson:
    time-zone: Asia/Seoul
  jpa:
    # ddl-auto는 여기 두지 않는다. 스키마는 Flyway 마이그레이션(src/main/resources/db/migration)이
    # 전담하고, Hibernate는 스키마를 만들거나 바꾸지 않는다(공유 DB에서 기동 시 스키마가
    # 의도치 않게 바뀌는 걸 막기 위함). 스키마를 바꿀 땐 새 V{n}__설명.sql 파일을 추가할 것.
    show-sql: true
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_APP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# access/refresh 토큰 발급용. jwt.secret은 운영에서 반드시 JWT_SECRET 환경변수로 override할 것
# (기본값은 로컬 기동이 깨지지 않게 하기 위한 임시값이라 운영에 쓰면 안 됨).
jwt:
  secret: ${JWT_SECRET:this-is-a-temporary-local-development-jwt-secret-please-override-with-JWT_SECRET-env-var}
  access-token-validity-seconds: 1800 # 30분
  refresh-token-validity-seconds: 2592000 # 30일(1달)
